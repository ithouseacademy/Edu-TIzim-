{% extends "base.html" %}
{% block title %}{{ title }} | Kassa{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h2><i class="fas fa-trash" style="color:#dc2626;"></i> {{ title }}</h2>
  </div>
</div>
<div style="max-width:500px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:32px;text-align:center;">
  <i class="fas fa-exclamation-triangle" style="font-size:48px;color:#f59e0b;margin-bottom:16px;"></i>
  <h3 style="margin-bottom:8px;">{{ object }} kassasini o'chirmoqchimisiz?</h3>
  <p style="color:var(--text-muted);margin-bottom:24px;">Bu kassa faolligi bekor qilinadi. Tranzaksiyalar tarixi saqlanib qolinadi.</p>
  <form method="post">
    {% csrf_token %}
    <div style="display:flex;gap:10px;justify-content:center;">
      <button type="submit" style="padding:10px 24px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:0.9rem;cursor:pointer;">Ha, o'chirish</button>
      <a href="{% url 'kassa_list' %}" style="padding:10px 20px;background:#f1f5f9;color:var(--text);border:1px solid var(--border);border-radius:8px;text-decoration:none;font-size:0.9rem;">Bekor qilish</a>
    </div>
  </form>
</div>
{% endblock %}
